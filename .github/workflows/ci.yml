name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest

      - name: Contrôle de conformité
        run: python scripts/check_compliance.py --repo . --report

      - name: Publier le rapport de conformité
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: reports/compliance/latest.md
